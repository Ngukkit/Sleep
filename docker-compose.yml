version: '3.8'

services:
  sleep-detection:
    build: .
    container_name: sleep-detection-app
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/app
      - /dev/video0:/dev/video0:rw  # 카메라 접근
    network_mode: host
    privileged: true
    devices:
      - /dev/video0:/dev/video0
    restart: unless-stopped 